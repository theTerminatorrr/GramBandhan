<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Projects — Grambandhan</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="gb-shell">
    <aside class="gb-sidebar" id="gb-sidebar"></aside>
    <main class="gb-main">
      <div class="gb-topbar" id="gb-topbar"></div>
      <div id="projects-content"><div class="gb-skeleton" style="height:300px;"></div></div>
    </main>
  </div>

  <!-- Invest modal -->
  <div class="gb-modal-overlay" id="invest-modal">
    <div class="glass-panel-solid gb-modal">
      <h3 style="color:var(--gb-text-dark);">Invest in this project</h3>
      <div id="invest-modal-body"></div>
    </div>
  </div>

  <!-- Progress update modal -->
  <div class="gb-modal-overlay" id="progress-modal">
    <div class="glass-panel-solid gb-modal">
      <h3 style="color:var(--gb-text-dark);">Post a progress update</h3>
      <div id="progress-modal-body"></div>
    </div>
  </div>

  <!-- Rating modal -->
  <div class="gb-modal-overlay" id="rating-modal">
    <div class="glass-panel-solid gb-modal">
      <h3 style="color:var(--gb-text-dark);">Rate this project</h3>
      <div id="rating-modal-body"></div>
    </div>
  </div>

  <!-- Reject reason modal -->
  <div class="gb-modal-overlay" id="reject-modal">
    <div class="glass-panel-solid gb-modal">
      <h3 style="color:var(--gb-text-dark);">Reject project</h3>
      <div id="reject-modal-body"></div>
    </div>
  </div>

  <!-- Fraud flag modal -->
  <div class="gb-modal-overlay" id="fraud-modal">
    <div class="glass-panel-solid gb-modal">
      <h3 style="color:var(--gb-text-dark);">Flag for review</h3>
      <div id="fraud-modal-body"></div>
    </div>
  </div>

<script src="js/db.js"></script>
<script src="js/utils.js"></script>
<script src="js/auth.js"></script>
<script src="js/notifications.js"></script>
<script src="js/risk.js"></script>
<script src="js/nav.js"></script>
<script src="js/projects.js"></script>
</body>
</html>
