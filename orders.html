<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Orders — Grambandhan</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="gb-shell">
    <aside class="gb-sidebar" id="gb-sidebar"></aside>
    <main class="gb-main">
      <div class="gb-topbar" id="gb-topbar"></div>
      <h2>My Orders</h2>
      <div id="orders-list" class="glass-card"></div>
    </main>
  </div>

<script src="js/db.js"></script>
<script src="js/utils.js"></script>
<script src="js/auth.js"></script>
<script src="js/notifications.js"></script>
<script src="js/nav.js"></script>
<script>
  const user = gbInitPage(['BUYER', 'INVESTOR'], 'orders.html');
  if (user) {
    const orders = gbWhere('orders', o => o.buyerId === user.id).sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
    const statuses = ['PLACED', 'SHIPPED', 'DELIVERED'];
    document.getElementById('orders-list').innerHTML = orders.length ? orders.map(o => {
      const listing = gbGetById('productListings', o.listingId);
      return `
      <div style="padding:12px 0; border-bottom:1px solid rgba(255,255,255,0.12); display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px;">
        <div>
          <strong>${gbEsc(listing ? listing.name : 'Product removed')}</strong>
          <div style="font-size:12.5px; opacity:0.8;">Qty ${o.qty} · ${gbCurrency(o.totalPrice)} · ${gbDate(o.createdAt)}</div>
        </div>
        <div style="display:flex; gap:8px; align-items:center;">
          <span class="gb-badge ${gbBadgeClass(o.status)}">${o.status}</span>
          ${user.role === 'BUYER' ? `<select class="gb-select" style="width:auto; padding:6px 10px;" data-order="${o.id}">
            ${statuses.map(s => `<option value="${s}" ${s === o.status ? 'selected' : ''}>${s}</option>`).join('')}
          </select>` : ''}
        </div>
      </div>`;
    }).join('') : `<div class="gb-empty"><div class="icon">📦</div>No orders yet — visit the marketplace to place one.</div>`;

    document.querySelectorAll('[data-order]').forEach(sel => {
      sel.addEventListener('change', () => {
        gbUpdate('orders', sel.dataset.order, { status: sel.value });
        gbToast('Order status updated.', 'success');
      });
    });
  }
</script>
</body>
</html>
